<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
</head>

<body>
  <header>
    <nav>
      <div class="logo">My Portfolio</div>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home">
      <h1>Hello, I'm [Your Name]</h1>
      <p>I am learning full-stack web development</p>
    </section>

    <section id="projects">
      <h2>My Projects</h2>
      <p>This is where I will showcase my code work (coming soon)</p>
    </section>

    <section id="contact">
      <h2>Contact Me</h2>
      <form>
        <label for="name">Your Name</label>
        <input type="text" class = "form-input" id="name" placeholder="Enter your name" required />

        <label for="email">Your Email</label>
        <input type="email" class = "form-input" id="email" placeholder="Enter your email" required />

        <label for="message">Your Message? or Question</label>
        <textarea class = "form-input" id="message" placeholder="Any thoughts?"></textarea>

        <label for="age">Age</label>
        <input type="number" class = "form-input" id="age" placeholder="Enter your age" required />

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Portfolio. All rights reserved.</p>
  </footer>
</body>

</html>
